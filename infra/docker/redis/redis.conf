# ============================================
# Redis 配置文件（开发环境）
# ============================================

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 持久化配置
save 900 1
save 300 10
save 60 10000

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"

# 最大内存（1GB）
maxmemory 1gb

# 内存淘汰策略（LRU）
maxmemory-policy allkeys-lru

# 日志级别
loglevel notice

# 数据库数量
databases 16

# 超时时间（0 表示不超时）
timeout 0

# TCP keepalive
tcp-keepalive 300

